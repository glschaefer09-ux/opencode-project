name: Claude Code

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] gated on author_association below
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

permissions: {}

jobs:
  claude:
    # Public repo: only the owner, org members and collaborators can trigger a
    # run that uses the Anthropic key. Fork PRs never get secrets.
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name != 'pull_request' &&
         contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
